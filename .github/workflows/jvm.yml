name: jvm

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Ledger and perception tests
        run: ./gradlew --no-daemon :core:ledger:test :core:perception:test
      - name: Shell script syntax
        run: bash -n platform/scripts/*.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: core/*/build/test-results/test/*.xml
