name: jvm

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test every JVM module
        run: ./gradlew --no-daemon -Dkotlin.compiler.execution.strategy=in-process build -x :eval:replay:distTar -x :eval:replay:distZip
      - name: Shell script syntax
        run: bash -n platform/scripts/*.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/build/test-results/test/*.xml'
